[build-system]
requires = ["setuptools>=61", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "ovos-PHAL-plugin-mk2-fan-control"
dynamic = ["version"]
description = "An OVOS PHAL plugin to control the fan on the mark2 dev kit"
readme = "README.md"
license = {text = "MIT"}
authors = [
    {name = "builderjer", email = "builderjer@gmail.com"}
]
requires-python = ">=3.9"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Topic :: Text Processing :: Linguistic",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.9",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11"
]
dependencies = [
    "ovos-plugin-manager>=2.1.0,<3.0.0",
    "ovos-i2c-detection>=0.0.0a5"
]

[project.urls]
Homepage = "https://github.com/OpenVoiceOS/ovos-PHAL-plugin-mk2-v6-fan-control"

[project.entry-points."opm.phal"]
"ovos-PHAL-plugin-mk2-v6-fan-control" = "ovos_PHAL_plugin_mk2_v6_fan_control:Mk2Rev6FanControls"

[tool.setuptools.dynamic]
version = {attr = "ovos_PHAL_plugin_mk2_v6_fan_control.version.__version__"}

[tool.setuptools.packages.find]
where = ["."]
include = ["ovos_PHAL_plugin_mk2_v6_fan_control*"]

[tool.setuptools.package-data]
ovos_PHAL_plugin_mk2_v6_fan_control = ["*.json"]
